name: Deploy Odoo Modules

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to remote Odoo server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            COMPOSE_FILE="docker/server/odoo.yaml"
            PROJECT_DIR="/root/odoo19/thamar_dani"
            DB_NAME="HR-Production"

            cd "$PROJECT_DIR"

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Docker compose file not found: $COMPOSE_FILE"
              exit 1
            fi

            echo "Syncing with latest changes..."
            git fetch origin master
            git reset --hard origin/master

            echo "Building the updated Odoo image..."
            docker compose -f "$COMPOSE_FILE" build odoo

            # IMPORTANT:
            # Do not run '-u web' automatically on production.
            # A previous web upgrade failed while loading Enterprise account_reports.
            echo "Recreating Odoo with the updated image/code..."
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate odoo

            echo "Waiting for Odoo database $DB_NAME..."
            healthy=0
            for i in {1..24}; do
              if curl -fsS "http://localhost:8069/web/login?db=$DB_NAME" >/dev/null; then
                healthy=1
                echo "Odoo is up and responding for $DB_NAME."
                break
              fi

              echo "Waiting 5s (attempt $i/24)..."
              sleep 5
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Odoo health check failed."
              echo "========== ODOO LOGS =========="
              docker logs odoo --tail 500 2>&1 || true
              echo "========== POSTGRES LOGS =========="
              docker logs pg-db --tail 200 2>&1 || true
              exit 1
            fi

            echo "Container status:"
            docker compose -f "$COMPOSE_FILE" ps odoo

            echo "Deployment completed successfully."
