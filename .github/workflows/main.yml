name: Deploy Odoo Modules

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to remote Odoo server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # الخروج فوراً في حال حدوث أي خطأ

            # Variables
            COMPOSE_FILE="docker/server/odoo.yaml"
            PROJECT_DIR="/root/odoo19/thamar_dani"

            # Navigate to project directory
            if [ -d "$PROJECT_DIR" ]; then
                echo "المجلد موجود، جاري الدخول..."
            else
                echo "Project directory not found at expected location: $PROJECT_DIR"
                exit 1
            fi

            cd "$PROJECT_DIR"
            echo "المسار الحالي: $PROJECT_DIR"

            # Verify docker-compose file exists
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Docker compose file not found: $COMPOSE_FILE"
              exit 1
            fi

            # Pull latest changes
            echo "Syncing with latest changes..."
            git fetch origin master
            git reset --hard origin/master

            # تحديث وبناء الحاويات دون مسح الـ Volumes الثابتة
            echo "Updating containers..."
            docker compose -f "$COMPOSE_FILE" up -d --build

            # ✨ السطر السحري: تنظيف وإعادة بناء كاش الـ Assets لقاعدة Live لمنع الشاشة البيضاء
            echo "Regenerating assets and icons for Live database..."
            docker compose -f "$COMPOSE_FILE" exec -T odoo odoo -d Live -u web --stop-after-init

            # إعادة تشغيل خفيفة لحاوية أودو لتقرأ الملفات الجديدة المصنفة
            echo "Soft restarting Odoo service to apply clean assets..."
            docker compose -f "$COMPOSE_FILE" restart odoo

            # الانتظار حتى يتأكد النظام أن المنفذ يعمل
            echo "Waiting for Odoo to be ready (Port 8069)..."
            until curl -s http://localhost:8069 > /dev/null; do 
              echo "Odoo is still loading its Registry... (Waiting 5s)"
              sleep 5
            done 

            echo "Deployment completed successfully with asset auto-repair!"
