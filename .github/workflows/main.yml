name: Deploy Odoo Modules

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to remote Odoo server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # Exit on any error

            # Variables
            COMPOSE_FILE="docker/server/odoo.yaml"

            # Navigate to project directory
            if [ -d "/root/odoo19/thamar_dani" ]; then
                PROJECT_DIR="/root/odoo19/thamar_dani"
            elif [ -d "/root/odoo19/thamar_dani" ]; then
                PROJECT_DIR="/root/odoo19/thamar_dani"
            else
                echo "Project directory not found at expected locations"
                exit 1
            fi

            cd "$PROJECT_DIR"
            echo "$PROJECT_DIR"

            # Verify docker-compose file exists
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Docker compose file not found: $COMPOSE_FILE"
              exit 1
            fi

            # Pull latest changes
            echo "Syncing with latest changes..."
            git fetch origin master
            git reset --hard origin/master

            # Stop and remove existing containers (including orphans like nginx)
            echo "Stopping existing containers..."
            docker compose -f "$COMPOSE_FILE" down --remove-orphans


            echo "Restarting services..."

            # Start new containers
            echo "Starting new containers..."
            docker compose -f "$COMPOSE_FILE" up -d

            echo "Waiting for Odoo to be ready (Port 8069)..."
            until curl -s http://localhost:8069 > /dev/null; do 
              echo "Odoo is still loading its Registry... (Waiting 5s)"
              sleep 5
            done 

            echo "Deployment completed successfully!"
