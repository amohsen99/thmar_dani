name: Deploy Odoo Modules

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to remote Odoo server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # Exit on any error

            # Variables
            COMPOSE_FILE="docker/server/odoo.yaml"

            # Navigate to project directory
            if [ -d "/root/odoo19/thamar_dani" ]; then
                PROJECT_DIR="/root/odoo19/thamar_dani"
            elif [ -d "/root/odoo19/thmar_dani" ]; then
                PROJECT_DIR="/root/odoo19/thmar_dani"
            else
                echo "Project directory not found at expected locations"
                exit 1
            fi

            cd "$PROJECT_DIR"

            # Verify docker-compose file exists
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Docker compose file not found: $COMPOSE_FILE"
              exit 1
            fi

            # Pull latest changes
            echo "Syncing with latest changes..."
            git fetch origin master
            git reset --hard origin/master

            # Stop and remove existing containers (including orphans like nginx)
            echo "Stopping existing containers..."
            docker compose -f "$COMPOSE_FILE" down --remove-orphans

            echo "Updating Odoo modules to sync database schema..."
            # تشغيل حاوية مؤقتة لعمل Upgrade للموديول الذي أضفت فيه الحقل
            # استبدل 'your_module_name' باسم الموديول الخاص بك
            # docker compose -f "$COMPOSE_FILE" run --rm odoo odoo -u thamar_mrp_custom -d OmarGroup_Prelive_V2 --stop-after-init

            echo "Restarting services..."

            # Start new containers
            echo "Starting new containers..."
            docker compose -f "$COMPOSE_FILE" up -d

            # Wait for services to be healthy
            echo "Waiting for services to be ready..."
            sleep 30

            # echo "Restarting Odoo to regenerate assets..."
            # docker compose -f "$COMPOSE_FILE" restart odoo

            # Check if Odoo container is running
            if docker compose -f "$COMPOSE_FILE" ps | grep -q "Up"; then
              echo "Deployment completed successfully!"
            else
              echo "Warning: Some containers may not be running properly"
              docker compose -f "$COMPOSE_FILE" ps
              exit 1
            fi
