version: "3.8"

networks:
  thmar-apps:
    driver: bridge

volumes:
  pgadmin:
  db-data:
  odoo-web-data:
  npm-data:
  npm-letsencrypt:

# إعداد عام للـ Logging لتقليل التكرار (Optional)
x-logging: &default-logging
  options:
    max-size: "50m"
    max-file: "3"
  driver: json-file

services:
  pg-db:
    image: postgres:15
    container_name: pg-db
    logging: *default-logging
    environment:
      - POSTGRES_USER=odoo19
      - POSTGRES_PASSWORD=odoo19
    ports:
      - "5433:5432"
    networks:
      - thmar-apps
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: pgadmin
    logging: *default-logging
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    networks:
      - thmar-apps
    volumes:
      - pgadmin:/var/lib/pgadmin

  npm-app:
    image: "jc21/nginx-proxy-manager:latest"
    container_name: npm-app
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - thmar-apps

  odoo:
    image: odoo:19.0
    container_name: odoo
    logging: *default-logging
    depends_on:
      - pg-db
    ports:
      - "8072:8072"
    environment:
      - HOST=pg-db
      - USER=odoo19
      - PASSWORD=odoo19
    command: ["odoo", "--workers=9", "--proxy-mode"]
    volumes:
      - ./odoo_e/etc/:/etc/odoo/
      - ../../../enterprise-19.0:/mnt/enterprise_addons
      - ../../../thmar_dani:/mnt/thamar_addons
      - odoo-web-data:/var/lib/odoo
    networks:
      - thmar-apps
    restart: always
