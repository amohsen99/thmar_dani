version: "3.8"

networks:
  thmar-apps:
    driver: bridge

volumes:
  pgadmin:
  db-data:
  odoo-web-data:
  npm-data:
  npm-letsencrypt:

# إعداد عام للـ Logging لتقليل التكرار (Optional)
x-logging: &default-logging
  options:
    max-size: "50m"
    max-file: "3"
  driver: json-file

services:
  pg-db:
    image: postgres:15
    container_name: pg-db
    logging: *default-logging
    environment:
      - POSTGRES_USER=odoo19
      - POSTGRES_PASSWORD=odoo19
      # PostgreSQL tuning for 16 GB VPS
      # shared_buffers: ~25% of RAM
      - POSTGRES_SHARED_BUFFERS=4GB
      # effective_cache_size: ~75% of RAM (hint to query planner)
      - POSTGRES_EFFECTIVE_CACHE_SIZE=12GB
      # work_mem: RAM per sort/hash per query — important for complex joins
      - POSTGRES_WORK_MEM=64MB
      # maintenance_work_mem: for VACUUM, CREATE INDEX
      - POSTGRES_MAINTENANCE_WORK_MEM=512MB
    command: >
      postgres
        -c shared_buffers=4GB
        -c effective_cache_size=12GB
        -c work_mem=64MB
        -c maintenance_work_mem=512MB
        -c max_connections=100
        -c checkpoint_completion_target=0.9
        -c wal_buffers=64MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
    ports:
      - "5433:5432"
    networks:
      - thmar-apps
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: pgadmin
    logging: *default-logging
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    networks:
      - thmar-apps
    volumes:
      - pgadmin:/var/lib/pgadmin

  npm-app:
    image: "jc21/nginx-proxy-manager:latest"
    container_name: npm-app
    restart: always
    logging: *default-logging
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - thmar-apps

  odoo:
    image: odoo:19.0
    container_name: odoo
    logging: *default-logging
    depends_on:
      - pg-db
    ports:
      - "8069:8069" # Main HTTP port
      - "8072:8072" # Longpolling / WebSocket
    environment:
      - HOST=pg-db
      - USER=odoo19
      - PASSWORD=odoo19
    command: odoo --gevent-port=8072 --proxy-mode
    mem_limit: 10g
    volumes:
      - ./odoo_e/etc/:/etc/odoo/
      - ../../../enterprise-19.0:/mnt/enterprise_addons
      - ../../../thamar_dani:/mnt/thamar_addons
      - odoo-web-data:/var/lib/odoo
    networks:
      - thmar-apps
    restart: always
  