# version: "3.8"

networks:
  thmar-apps:
    driver: bridge

volumes:
  pgadmin:
  db-data:
  odoo-web-data:

services:
  pg-db:
    image: postgres:15
    container_name: pg-db
    environment:
      - POSTGRES_USER=odoo19
      - POSTGRES_PASSWORD=odoo19
    ports:
      - "5433:5432"
    networks:
      - thmar-apps
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    networks:
      - thmar-apps
    volumes:
      - pgadmin:/var/lib/pgadmin

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - odoo
    networks:
      - thmar-apps

  odoo:
    image: odoo:19.0
    container_name: odoo
    depends_on:
      - pg-db
    # ports:
    #   - "8019:8069"
    #   - "8072:8072"
    environment:
      HOST: pg-db
    volumes:
      # Mirror Odoo config
      - ./odoo_e/etc/:/etc/odoo/
      # Optional: Mount addons if needed
      - ../../../enterprise-19.0:/mnt/enterprise_addons
      - ../../../thmar_dani:/mnt/thamar_addons
      - odoo-web-data:/var/lib/odoo
    networks:
      - thmar-apps
    restart: always
