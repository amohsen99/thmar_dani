user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Map for WebSocket Upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    access_log  off;
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  3600s;
    keepalive_requests 2000;
    
    # Header buffers
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;
    client_body_buffer_size 1M;

    # Timeouts for large uploads
    client_body_timeout 3600s;
    client_header_timeout 3600s;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstreams with Keepalive
    upstream odoo {
        server odoo:8069;
        keepalive 64;
    }

    upstream odoochat {
        server odoo:8072;
        keepalive 16;
    }

    server {
        listen 80;
        server_name omrgrp.cloud 72.61.186.1;

        # Increase limits for Database restores
        client_max_body_size 5000M;
        proxy_read_timeout 7200s;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        send_timeout 7200s;
        
        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffers 32 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;

        # Standard Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Static Asset Caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 31536000s;
            proxy_pass http://odoo;
            add_header Cache-Control "public, no-transform";
        }

        # Websocket & Longpolling support (Real-time chat)
        location ~* ^/(websocket|longpolling) {
            proxy_pass http://odoochat;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Special handling for DB operations
        location /web/database {
            proxy_pass http://odoo;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # Handle standard requests
        location / {
            proxy_redirect off;
            proxy_pass http://odoo;
        }
    }
}
